name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build JS production webpack
        run: ./gradlew :composeApp:jsBrowserProductionWebpack --no-daemon --stacktrace

      - name: Copy .nojekyll to output
        if: success()
        run: touch composeApp/build/dist/js/productionWebpack/.nojekyll

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./composeApp/build/dist/js/productionWebpack
          publish_branch: gh-pages

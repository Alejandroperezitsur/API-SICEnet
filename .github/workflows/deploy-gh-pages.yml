name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build JS production webpack
        run: ./gradlew :composeApp:jsBrowserProductionWebpack --no-daemon

      - name: Find webpack output
        run: |
          echo "=== Searching for JS output files ==="
          find composeApp/build -name "*.js" -path "*/dist/*" -type f 2>/dev/null | head -20
          echo "=== Searching for index.html ==="
          find composeApp/build -name "index.html" -type f 2>/dev/null | head -10
          echo "=== dist directory structure ==="
          find composeApp/build/dist -type d 2>/dev/null | head -20
          echo "=== ALL directories under build ==="
          find composeApp/build -type d -maxdepth 4 2>/dev/null | head -40
          echo "=== distributions directory ==="
          find composeApp/build/distributions -type f 2>/dev/null | head -20

      - name: Prepare deploy
        run: |
          mkdir -p deploy_output
          # Try all possible output locations
          for dir in composeApp/build/dist/js/productionWebpack composeApp/build/dist/js/productionExecutable composeApp/build/distributions; do
            if [ -d "$dir" ] && [ "$(ls -A $dir 2>/dev/null)" ]; then
              echo "Copying from $dir"
              cp -r "$dir"/* deploy_output/
            fi
          done
          # If nothing found, try broader search
          if [ -z "$(ls -A deploy_output 2>/dev/null)" ]; then
            echo "No output found in standard paths, searching..."
            find composeApp/build -name "composeApp.js" -type f 2>/dev/null | while read f; do
              cp "$(dirname "$f")"/* deploy_output/ 2>/dev/null
            done
          fi
          # Ensure index.html exists
          if [ ! -f "deploy_output/index.html" ]; then
            cp composeApp/src/jsMain/resources/index.html deploy_output/
          fi
          touch deploy_output/.nojekyll
          echo "=== deploy_output ==="
          ls -la deploy_output/

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          publish_branch: gh-pages
          force_orphan: true

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build wasmJs production distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Find wasmJs output
        run: |
          echo "=== wasmJs productionExecutable directory ==="
          find composeApp/build/dist/wasmJs/productionExecutable -type f 2>/dev/null | head -30
          echo "=== All dist directories ==="
          find composeApp/build/dist -type d 2>/dev/null | head -20

      - name: Validate build output
        run: |
          WASM_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          if [ ! -d "$WASM_DIR" ]; then
            echo "ERROR: Output directory not found at $WASM_DIR"
            exit 1
          fi
          if [ ! -f "$WASM_DIR/composeApp.js" ]; then
            echo "ERROR: composeApp.js not found in $WASM_DIR"
            echo "Files present:"
            ls -la "$WASM_DIR/"
            exit 1
          fi
          echo "Build output validated successfully"
          ls -la "$WASM_DIR/"

      - name: Prepare deploy
        run: |
          mkdir -p deploy_output
          WASM_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          cp -r "$WASM_DIR"/* deploy_output/
          # Ensure .nojekyll exists so GitHub Pages serves .wasm files correctly
          touch deploy_output/.nojekyll
          echo "=== deploy_output ==="
          ls -la deploy_output/

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          publish_branch: gh-pages
          force_orphan: true

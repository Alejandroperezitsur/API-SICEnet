name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build JS production webpack
        run: ./gradlew :composeApp:jsBrowserProductionWebpack --no-daemon

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy_output
          find composeApp/build/dist -type f 2>/dev/null | head -50
          echo "---"
          find composeApp/build/distributions -type f 2>/dev/null | head -50
          echo "---"
          if [ -d "composeApp/build/dist/js/productionWebpack" ]; then
            echo "Found productionWebpack"
            cp -r composeApp/build/dist/js/productionWebpack/* deploy_output/
          elif [ -d "composeApp/build/dist/js/productionExecutable" ]; then
            echo "Found productionExecutable"
            cp -r composeApp/build/dist/js/productionExecutable/* deploy_output/
          else
            echo "Trying to find webpack output..."
            WEBPACK_DIR=$(find composeApp/build -type d -name "productionWebpack" 2>/dev/null | head -1)
            if [ -n "$WEBPACK_DIR" ]; then
              echo "Found at: $WEBPACK_DIR"
              cp -r "$WEBPACK_DIR"/* deploy_output/
            else
              echo "ERROR: No webpack output found!"
              find composeApp/build -type d 2>/dev/null | head -30
              exit 1
            fi
          fi
          if [ ! -f "deploy_output/index.html" ] && [ -f "composeApp/src/jsMain/resources/index.html" ]; then
            cp composeApp/src/jsMain/resources/index.html deploy_output/
          fi
          touch deploy_output/.nojekyll
          echo "=== deploy_output contents ==="
          ls -la deploy_output/

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          publish_branch: gh-pages
          force_orphan: true
